[project]
name = "study-with-ai"
version = "0.2.0"
description = "Local Streamlit study workspace with a ChatGPT-authenticated Codex provider"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.4.2",
    "pillow==12.1.1",
    "pymupdf==1.27.1",
    "pytesseract==0.3.13",
    "streamlit==1.54.0",
    "plotly==6.6.0",
    "pandas==2.3.3",
    "janome==0.5.0",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers==5.1.2"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.12", "mypy>=1.17", "types-jsonschema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["live: opt-in real Codex request", "semantic: opt-in cached embedding model test"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/"]
